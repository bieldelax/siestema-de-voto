<!-- Ponte de estado compartilhado: precisa vir antes do app -->
<script>
(() => {
  const SUPABASE_URL = 'https://kwzbqntohggbaimfqiuu.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_5tDKexHtQVeqLYJYbtT3Ug_cn19ysY8';
  const REST = SUPABASE_URL + '/rest/v1/shared_state';
  const HEADERS = {
    apikey: SUPABASE_KEY,
    Authorization: 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  };

  async function sharedGet(key) {
    const url = REST + '?key=eq.' + encodeURIComponent(key) + '&select=value';
    const r = await fetch(url, { headers: HEADERS, cache: 'no-store' });
    if (!r.ok) throw new Error('Supabase GET ' + r.status);
    const rows = await r.json();
    return rows && rows.length ? { value: rows[0].value } : null;
  }

  async function sharedSet(key, value) {
    const r = await fetch(REST + '?on_conflict=key', {
      method: 'POST',
      headers: Object.assign({}, HEADERS, { Prefer: 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify({ key, value, updated_at: new Date().toISOString() })
    });
    if (!r.ok) throw new Error('Supabase SET ' + r.status + ' ' + await r.text().catch(() => ''));
    return { ok: true };
  }

  window.storage = {
    async get(key, isShared) {
      if (!isShared) {
        const raw = localStorage.getItem('octa_local_' + key);
        return raw == null ? null : { value: raw };
      }
      return sharedGet(key);
    },
    async set(key, value, isShared) {
      if (!isShared) {
        localStorage.setItem('octa_local_' + key, value);
        return { ok: true };
      }
      return sharedSet(key, value);
    }
  };

  let lastStamp = '';
  let syncing = false;

  async function pollChanges() {
    if (syncing) return;
    syncing = true;
    try {
      const r = await fetch(REST + '?select=key,updated_at&key=in.(employees,records,settings)&order=updated_at.desc&limit=3', { headers: HEADERS, cache: 'no-store' });
      if (!r.ok) return;
      const stamp = JSON.stringify(await r.json() || []);
      if (!lastStamp) { lastStamp = stamp; return; }
      if (stamp === lastStamp) return;
      if (typeof loadData !== 'function' || typeof renderApp !== 'function' || typeof state === 'undefined') return;
      const chatInput = document.getElementById('chat-text-input');
      if (state.currentModal || state.welcomeOverlay || (chatInput && chatInput.value.trim())) return;
      await loadData();
      renderApp();
      lastStamp = stamp;
    } catch (e) {
      console.warn('Octafin live sync:', e);
    } finally {
      syncing = false;
    }
  }

  setInterval(pollChanges, 2000);
  setTimeout(pollChanges, 250);
  window.__octafinLiveReady = true;
})();
</script>

<!-- CANVAS 3D GLOBAL: UNIVERSO CÓSMICO NASA STYLE -->
<canvas id="cosmic-3d-bg"></canvas>

<!-- SISTEMA PRINCIPAL -->
<div id="app">
  <div class="sidebar">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 3v18"/>
          <path d="M3 12h18"/>
          <circle cx="12" cy="12" r="4"/>
        </svg>
      </div>
      <div class="brand-text">
        <h2>Octafin</h2>
        <span>Comitê 3D Cósmico</span>
      </div>
    </div>

    <div id="identity-slot"></div>
    <nav class="nav-tabs" id="nav-tabs-slot"></nav>

    <button class="btn-cta-acionar" id="btn-acionar-slot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      Acionar Reunião
    </button>
  </div>

  <div class="main-viewport">
    <div id="ribbon-slot"></div>
    <div class="content-container tilt-3d-parent" id="content-slot"></div>
  </div>

<div id="modal-slot"></div>
<div id="welcome-slot"></div>
<div class="toast-alert" id="toast-el"></div>

<script>
/* =========================================================================
   1. UNIVERSO 3D DE FUNDO REALISTA (NASA AESTHETICS)
   ========================================================================= */

class FullSpace3DUniverse {
  constructor() {
    this.canvas = document.getElementById('cosmic-3d-bg');
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    this.camera.position.set(0, 0, 26);

    this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    this.clock = new THREE.Clock();
    this.mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

    this.initLights();
    this.initStarfield();
    this.initNebulaClouds();
    this.initCosmicOctopus();
    this.initSpaceship();
    this.initExplodingPlanet();
    this.bindEvents();
    this.animate();
  }

  initLights() {
    // Luz ambiente suave e realista do vácuo estelar
    const amb = new THREE.AmbientLight(0x131B2E, 1.4);
    this.scene.add(amb);

    // Luz direcional simulando estrela principal distante (sol)
    this.sunLight = new THREE.DirectionalLight(0xFDFBF7, 2.4);
    this.sunLight.position.set(20, 15, 12);
    this.scene.add(this.sunLight);

    // Reflexo azulado da nebulosa cósmica
    this.rimLight = new THREE.DirectionalLight(0x1FBFAE, 1.6);
    this.rimLight.position.set(-20, -10, 8);
    this.scene.add(this.rimLight);
  }

  /* Textura procedural para partículas e brilhos estelares */
  createStarTexture() {
    const c = document.createElement('canvas');
    c.width = 64; c.height = 64;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.2, 'rgba(230,245,255,0.85)');
    grad.addColorStop(0.5, 'rgba(100,200,255,0.25)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }

  initStarfield() {
    this.starGroup = new THREE.Group();
    const starTex = this.createStarTexture();

    // Estrelas com diferentes espectros (O, B, A, G, M) e profundidades
    const layers = [
      { count: 1200, size: 0.16, color: 0xF8FAFC, depth: 70 },
      { count: 600,  size: 0.28, color: 0x93C5FD, depth: 55 },
      { count: 250,  size: 0.45, color: 0xFDE68A, depth: 40 }
    ];

    layers.forEach(l => {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(l.count * 3);
      for (let j = 0; j < l.count * 3; j += 3) {
        pos[j] = (Math.random() - 0.5) * 160;
        pos[j + 1] = (Math.random() - 0.5) * 110;
        pos[j + 2] = -15 - Math.random() * l.depth;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        color: l.color,
        size: l.size,
        map: starTex,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        opacity: 0.85
      });
      this.starGroup.add(new THREE.Points(geo, mat));
    });

    this.scene.add(this.starGroup);
  }

  /* Nuvens de Nebulosa Procedural NASA Deep Field */
  initNebulaClouds() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    const grad = ctx.createRadialGradient(256, 256, 10, 256, 256, 250);
    grad.addColorStop(0, 'rgba(34, 211, 238, 0.22)');
    grad.addColorStop(0.4, 'rgba(76, 111, 255, 0.14)');
    grad.addColorStop(0.7, 'rgba(139, 92, 246, 0.08)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 512, 512);

    const nebTex = new THREE.CanvasTexture(c);
    const nebGeo = new THREE.PlaneGeometry(85, 65);
    const nebMat = new THREE.MeshBasicMaterial({
      map: nebTex,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      opacity: 0.55
    });

    const nebula1 = new THREE.Mesh(nebGeo, nebMat);
    nebula1.position.set(-18, 6, -30);
    this.scene.add(nebula1);

    const nebula2 = new THREE.Mesh(nebGeo, nebMat.clone());
    nebula2.position.set(22, -12, -35);
    nebula2.rotation.z = Math.PI * 0.4;
    nebula2.material.opacity = 0.4;
    this.scene.add(nebula2);
  }

  /* 1. POLVO CÓSMICO (Bioluminescent Celestial Leviathan) */
  initCosmicOctopus() {
    this.octopus = new THREE.Group();

    // Cabeça orgânica aerodinâmica com brilho bioluminescente
    const headGeo = new THREE.SphereGeometry(1.8, 32, 28);
    headGeo.scale(1.0, 0.85, 1.45);

    // Textura procedural com veias de luz cyan/gold no manto
    const c = document.createElement('canvas');
    c.width = 256; c.height = 256;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#061324';
    ctx.fillRect(0, 0, 256, 256);
    ctx.strokeStyle = '#22D3EE';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#22D3EE';
    ctx.shadowBlur = 10;
    for (let i = 0; i < 7; i++) {
      ctx.beginPath();
      ctx.arc(36 * i + 20, 128, 45, 0, Math.PI * 2);
      ctx.stroke();
    }
    const octoTex = new THREE.CanvasTexture(c);

    const octoMat = new THREE.MeshStandardMaterial({
      color: 0x0A192F,
      map: octoTex,
      roughness: 0.25,
      metalness: 0.7,
      emissive: 0x052B3A,
      emissiveIntensity: 0.6
    });

    this.octoHead = new THREE.Mesh(headGeo, octoMat);
    this.octopus.add(this.octoHead);

    // Olhos cósmicos azuis profundos
    const eyeGeo = new THREE.SphereGeometry(0.28, 20, 20);
    const eyeMat = new THREE.MeshStandardMaterial({
      color: 0x22D3EE,
      emissive: 0x22D3EE,
      emissiveIntensity: 1.2,
      roughness: 0.1
    });
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.75, 0.25, 1.25);
    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.75, 0.25, 1.25);
    this.octopus.add(leftEye);
    this.octopus.add(rightEye);

    // 8 Tentáculos tridimensionais com ventosas douradas e nós bioluminescentes
    this.tentacles = [];
    const suckerMat = new THREE.MeshStandardMaterial({
      color: 0xE4C37F,
      emissive: 0xE4C37F,
      emissiveIntensity: 0.5,
      metalness: 0.9,
      roughness: 0.2
    });

    for (let t = 0; t < 8; t++) {
      const angle = (t / 8) * Math.PI * 2;
      const tentacleGroup = new THREE.Group();
      tentacleGroup.position.set(Math.cos(angle) * 1.2, -0.4, Math.sin(angle) * 1.0);

      const segments = [];
      let parent = tentacleGroup;
      for (let s = 0; s < 9; s++) {
        const segGeo = new THREE.CylinderGeometry(0.18 - s * 0.016, 0.21 - s * 0.016, 0.65, 12);
        segGeo.translate(0, -0.32, 0);
        const segMesh = new THREE.Mesh(segGeo, octoMat);

        if (s % 2 === 0) {
          const sucker = new THREE.Mesh(new THREE.SphereGeometry(0.08, 10, 10), suckerMat);
          sucker.position.set(0, -0.32, 0.15);
          segMesh.add(sucker);
        }

        parent.add(segMesh);
        segments.push(segMesh);
        parent = segMesh;
      }

      this.octopus.add(tentacleGroup);
      this.tentacles.push({ group: tentacleGroup, segments, baseAngle: angle });
    }

    this.octopus.position.set(-22, -6, -8);
    this.octopus.scale.setScalar(1.35);
    this.scene.add(this.octopus);
  }

  /* 2. NAVE ESPACIAL REALISTA (NASA / ESA Deep Space Explorer) */
  initSpaceship() {
    this.ship = new THREE.Group();

    for (let x = 0; x < 128; x += 16) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 64); ctx.stroke(); }
    for (let y = 0; y < 64; y += 16) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(128, y); ctx.stroke(); }

  /* 3. PLANETA EXPLODINDO REALISTA (NASA Cataclysmic Exoplanet) */
  initExplodingPlanet() {
    this.planetGroup = new THREE.Group();
    this.planetGroup.position.set(22, 8, -22);

    // Textura procedural de alta fidelidade: Continentes basálticos com veios de magma
    const c = document.createElement('canvas');
    c.width = 512; c.height = 256;
    const ctx = c.getContext('2d');

    // Base vulcânica escura
    ctx.fillStyle = '#220D0D';
    ctx.fillRect(0, 0, 512, 256);

    // Fissuras tectônicas incandescentes (veios de magma)
    ctx.strokeStyle = '#FF5500';
    ctx.lineWidth = 4;
    ctx.shadowColor = '#FF9900';
    ctx.shadowBlur = 12;
    for (let i = 0; i < 16; i++) {
      ctx.beginPath();
      let x = Math.random() * 512;
      let y = Math.random() * 256;
      ctx.moveTo(x, y);
      for (let step = 0; step < 6; step++) {
        x += (Math.random() - 0.5) * 70;
        y += (Math.random() - 0.5) * 50;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
    // Núcleo branco-quente das fissuras
    ctx.strokeStyle = '#FFF3D6';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    const planetTex = new THREE.CanvasTexture(c);

    // Esfera planetária com relevo e emissão de calor
    const coreGeo = new THREE.SphereGeometry(3.0, 48, 48);
    const coreMat = new THREE.MeshStandardMaterial({
      map: planetTex,
      roughness: 0.55,
      metalness: 0.2,
      emissive: 0xB91C1C,
      emissiveIntensity: 0.7
    });
    this.planetCore = new THREE.Mesh(coreGeo, coreMat);
    this.planetGroup.add(this.planetCore);

    // Atmosfera com Fresnel Glow (Rayleigh scattering azul/âmbar)
    const atmosGeo = new THREE.SphereGeometry(3.22, 36, 36);
    const atmosMat = new THREE.MeshBasicMaterial({
      color: 0xFB923C,
      transparent: true,
      opacity: 0.28,
      blending: THREE.AdditiveBlending,
      side: THREE.BackSide
    });
    this.atmosphere = new THREE.Mesh(atmosGeo, atmosMat);
    this.planetGroup.add(this.atmosphere);

    // Anel planetário realista estilo Saturno com divisão de Cassini
    const ringGeo = new THREE.RingGeometry(3.6, 6.2, 64);
    const ringC = document.createElement('canvas');
    ringC.width = 256; ringC.height = 1;
    const rctx = ringC.getContext('2d');
    const rgrad = rctx.createLinearGradient(0, 0, 256, 0);
    rgrad.addColorStop(0, 'rgba(0,0,0,0)');
    rgrad.addColorStop(0.15, 'rgba(217, 119, 6, 0.75)');
    rgrad.addColorStop(0.55, 'rgba(245, 158, 11, 0.9)');
    rgrad.addColorStop(0.65, 'rgba(0,0,0,0.1)'); // Divisão de Cassini
    rgrad.addColorStop(0.72, 'rgba(217, 119, 6, 0.7)');
    rgrad.addColorStop(1, 'rgba(0,0,0,0)');
    rctx.fillStyle = rgrad;
    rctx.fillRect(0, 0, 256, 1);
    const ringTex = new THREE.CanvasTexture(ringC);

    const ringMat = new THREE.MeshStandardMaterial({
      map: ringTex,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.75,
      roughness: 0.7
    });
    this.rings = new THREE.Mesh(ringGeo, ringMat);
    this.rings.rotation.x = Math.PI * 0.42;
    this.rings.rotation.y = Math.PI * 0.12;
    this.planetGroup.add(this.rings);

    // Onda de choque cósmica suave (Shockwave esférica em expansão)
    const shockGeo = new THREE.RingGeometry(3.2, 4.4, 48);
    const shockMat = new THREE.MeshBasicMaterial({
      color: 0xF97316,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.0,
      blending: THREE.AdditiveBlending
    });
    this.shockwave = new THREE.Mesh(shockGeo, shockMat);
    this.shockwave.rotation.x = Math.PI * 0.35;
    this.planetGroup.add(this.shockwave);

    // Fragmentos de rocha basáltica e brasas incandescentes
    this.debrisCount = 70;
    this.debris = [];
    const debrisGeo = new THREE.DodecahedronGeometry(0.18);
    const debrisMat = new THREE.MeshStandardMaterial({
      color: 0x2A1515,
      emissive: 0xEA580C,
      emissiveIntensity: 0.85,
      roughness: 0.8
    });

    for (let i = 0; i < this.debrisCount; i++) {
      const d = new THREE.Mesh(debrisGeo, debrisMat);
      const dir = new THREE.Vector3(
        (Math.random() - 0.5) * 2,
        (Math.random() - 0.5) * 2,
        (Math.random() - 0.5) * 2
      ).normalize();
      const speed = 0.008 + Math.random() * 0.016; // Muito mais lento e cinematográfico!
      d.position.copy(dir.clone().multiplyScalar(3.0));
      this.planetGroup.add(d);
      this.debris.push({ mesh: d, dir, speed, dist: 3.0 });
    }

    this.scene.add(this.planetGroup);
  }

  bindEvents() {
    window.addEventListener('resize', () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener('mousemove', (e) => {
      this.mouse.targetX = (e.clientX / window.innerWidth - 0.5) * 2.0;
      this.mouse.targetY = (e.clientY / window.innerHeight - 0.5) * 2.0;
    }, { passive: true });
  }

  animate() {
    requestAnimationFrame(() => this.animate());

    const delta = this.clock.getDelta();
    const time = this.clock.getElapsedTime();

    // Parallax cósmico sutil e suave
    this.mouse.x += (this.mouse.targetX - this.mouse.x) * 0.035;
    this.mouse.y += (this.mouse.targetY - this.mouse.y) * 0.035;

    this.camera.position.x = this.mouse.x * 2.5;
    this.camera.position.y = -this.mouse.y * 2.0;
    this.camera.lookAt(0, 0, 0);

    // Rotação suave do campo estelar
    this.starGroup.rotation.y = time * 0.006 + this.mouse.x * 0.03;

    // 1. POLVO CÓSMICO (Nado majestoso em ciclo lento de 40s)
    this.octopus.position.x = -22 + Math.sin(time * 0.16) * 14;
    this.octopus.position.y = -6 + Math.cos(time * 0.22) * 3.2;
    this.octopus.position.z = -8 + Math.sin(time * 0.12) * 5;
    this.octopus.rotation.y = Math.cos(time * 0.16) * 0.35 + 0.3;
    this.octopus.rotation.z = Math.sin(time * 0.18) * 0.12;

    this.tentacles.forEach((tData) => {
      tData.segments.forEach((seg, sIdx) => {
        const wave = Math.sin(time * 1.4 + sIdx * 0.42 + tData.baseAngle) * 0.16;
        seg.rotation.z = wave;
        seg.rotation.x = Math.cos(time * 1.1 + sIdx * 0.38) * 0.12;
      });
    });

    // 2. NAVE ESPACIAL (Passagem orbital lenta e majestosa de ~55s)
    const shipCycle = (time * 1.5) % 80;
    this.ship.position.x = -45 + shipCycle * 1.15;
    this.ship.position.y = 9 + Math.sin(time * 0.4) * 1.6;
    this.ship.position.z = -20 + Math.cos(time * 0.3) * 2.5;
    this.ship.rotation.z = -0.22 + Math.sin(time * 0.5) * 0.08;
    this.ionPlume.scale.set(1 + Math.sin(time * 10) * 0.15, 1 + Math.cos(time * 12) * 0.2, 1);

    // 3. PLANETA EXPLODINDO (Ciclo super lento, dramático e realista de ~45s)
    this.planetCore.rotation.y = time * 0.04;
    this.rings.rotation.z = time * 0.02;

    const explosionCycle = (time * 0.14) % 1.0; // 0.0 a 1.0 em ~45 segundos
    if (explosionCycle < 0.35) {
      // Fase 1: Calma e magma pulsando suavemente
      this.planetCore.scale.setScalar(1.0 + Math.sin(time * 1.5) * 0.03);
      this.shockwave.material.opacity = 0.0;
      this.debris.forEach(d => {
        d.dist = 3.0;
        d.mesh.position.copy(d.dir.clone().multiplyScalar(d.dist));
      });
    } else if (explosionCycle < 0.75) {
      // Fase 2: Cataclismo e ejeção de magma em câmera lenta
      const p = (explosionCycle - 0.35) / 0.4;
      this.planetCore.scale.setScalar(1.0 + Math.sin(p * Math.PI) * 0.18);

      // Onda de choque sutil expandindo e dissipando
      this.shockwave.scale.setScalar(1.0 + p * 4.5);
      this.shockwave.material.opacity = Math.max(0, Math.sin(p * Math.PI) * 0.65);

      // Fragmentos e brasas rochosas derivando lentamente
      this.debris.forEach(d => {
        d.dist += d.speed;
        d.mesh.position.copy(d.dir.clone().multiplyScalar(d.dist));
        d.mesh.rotation.x += 0.015;
        d.mesh.rotation.y += 0.015;
      });
    } else {
      // Fase 3: Resfriamento e rearme da simulação
      const p3 = (explosionCycle - 0.75) / 0.25;
      this.shockwave.material.opacity = 0.0;
      this.debris.forEach(d => {
        d.dist = THREE.MathUtils.lerp(d.dist, 3.0, p3);
        d.mesh.position.copy(d.dir.clone().multiplyScalar(d.dist));
      });
    }

    this.renderer.render(this.scene, this.camera);
  }
}

async function storageGet(key, isShared) {
  if (isShared) {
    if (!window.storage || typeof window.storage.get !== 'function') {
      throw new Error(`Ponte de estado compartilhado ausente ao ler "${key}"`);
    }
    const res = await window.storage.get(key, isShared);
    return res ? JSON.parse(res.value) : null;
  }
  try {
    if (window.storage && typeof window.storage.get === 'function') {
      const res = await window.storage.get(key, isShared);
      return res ? JSON.parse(res.value) : null;
    }
  } catch (e) {
    console.warn('Storage local fallback:', e);
  }
  const raw = localStorage.getItem(`octa_${key}`);
  return raw ? JSON.parse(raw) : null;
}

async function storageSet(key, value, isShared) {
  if (isShared) {
    if (!window.storage || typeof window.storage.set !== 'function') {
      throw new Error(`Ponte de estado compartilhado ausente ao gravar "${key}"`);
    }
    await window.storage.set(key, JSON.stringify(value), isShared);
    return true;
  }
  try {
    if (window.storage && typeof window.storage.set === 'function') {
      await window.storage.set(key, JSON.stringify(value), isShared);
    }
  } catch (e) {
    console.warn('Storage local fallback:', e);
  }
  try {
    localStorage.setItem(`octa_${key}`, JSON.stringify(value));
    return true;
  } catch(e) {
    return false;
  }
}

async function loadData() {
  const [emp, rec, cfg, me] = await Promise.all([
    storageGet('employees', true),
    storageGet('records', true),
    storageGet('settings', true),
    storageGet('my_name', false)
  ]);

  if (emp && Array.isArray(emp) && emp.length > 0) {
    state.employees = emp;
  } else if (state.employees.length === 0) {
    state.employees = USERS.map(u => ({ id: uid(), name: u.name, points: 0 }));
    storageSet('employees', state.employees, true);
  }

  if (rec && Array.isArray(rec)) state.records = rec;
  if (cfg && cfg.pontosPorInfracao !== undefined) state.settings = cfg;
  if (me) state.me = me;
}

function uid() { return Math.random().toString(36).slice(2, 10); }
function getInitials(name) { return (name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase(); }

function showToast(msg) {
  const el = document.getElementById('toast-el');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => el.classList.remove('show'), 2800);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

class TabBook3DScene {
  constructor(containerEl, onUnlockedCallback) {
    this.container = containerEl;
    this.onUnlocked = onUnlockedCallback;
    this.width = containerEl.clientWidth || 800;
    this.height = containerEl.clientHeight || 560;
    this.isUnlocking = false;

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(45, this.width / this.height, 0.1, 100);
    this.camera.position.set(0, 0, 8.5);

    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setSize(this.width, this.height);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.container.appendChild(this.renderer.domElement);

    // Iluminação nobre para destacar o couro e dourado
    const amb = new THREE.AmbientLight(0xFFFFFF, 1.4);
    this.scene.add(amb);
    const goldDir = new THREE.DirectionalLight(0xE4C37F, 3.2);
    goldDir.position.set(6, 8, 7);
    this.scene.add(goldDir);
    const blueRim = new THREE.DirectionalLight(0x22D3EE, 1.8);
    blueRim.position.set(-6, -4, 5);
    this.scene.add(blueRim);

    this.createBook();
    this.animate();
  }

  // Gera capa de couro nobre com brasão dourado em Canvas 2D
  createCoverTexture() {
    const c = document.createElement('canvas');
    c.width = 512; c.height = 700;
    const ctx = c.getContext('2d');

    // Fundo de couro azul-meia-noite profundo
    ctx.fillStyle = '#0B1220';
    ctx.fillRect(0, 0, 512, 700);

    // Textura sutil de couro
    for (let i = 0; i < 3000; i++) {
      ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.015)' : 'rgba(0,0,0,0.04)';
      ctx.fillRect(Math.random() * 512, Math.random() * 700, 2, 2);
    }

    // Moldura Dourada Lavrada
    ctx.strokeStyle = '#E4C37F';
    ctx.lineWidth = 6;
    ctx.strokeRect(30, 30, 452, 640);
    ctx.lineWidth = 1.5;
    ctx.strokeRect(42, 42, 428, 616);

    // Cantoneiras ornamentadas
    const drawCorner = (x, y) => {
      ctx.fillStyle = '#E4C37F';
      ctx.beginPath();
      ctx.arc(x, y, 14, 0, Math.PI * 2);
      ctx.fill();
    };
    drawCorner(30, 30); drawCorner(482, 30); drawCorner(30, 670); drawCorner(482, 670);

    // Brasão Central
    ctx.textAlign = 'center';
    ctx.fillStyle = '#E4C37F';
    ctx.font = 'bold 24px Cinzel, serif';
    ctx.fillText('OCTAFIN', 256, 190);

    ctx.font = 'bold 32px Cinzel, serif';
    ctx.fillText('CÓDIGO DE CONDUTA', 256, 260);

    ctx.font = '600 16px "Plus Jakarta Sans", sans-serif';
    ctx.fillStyle = '#CBD5E1';
    ctx.fillText('DIRETRIZES & REGRAS DO COMITÊ', 256, 305);

    // Emblema geométrico sagrado
    ctx.strokeStyle = '#E4C37F';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(256, 420, 55, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(256, 345); ctx.lineTo(256, 495);
    ctx.moveTo(181, 420); ctx.lineTo(331, 420);
    ctx.stroke();

    ctx.font = 'bold 12px "Plus Jakarta Sans", sans-serif';
    ctx.fillStyle = '#94A3B8';
    ctx.fillText('EDIÇÃO OFICIAL CORPORATIVA', 256, 590);

    return new THREE.CanvasTexture(c);
  }

  createBook() {
    this.bookGroup = new THREE.Group();
    const w = 3.6, h = 4.8, d = 0.68;

    // Páginas internas com corte dourado brilhante
    const pGeo = new THREE.BoxGeometry(w * 0.94, h * 0.96, d * 0.86);
    const pMat = new THREE.MeshStandardMaterial({
      color: 0xE8DEC4,
      roughness: 0.7,
      metalness: 0.15
    });
    this.pages = new THREE.Mesh(pGeo, pMat);
    this.bookGroup.add(this.pages);

    // Material de couro dourado da capa
    const coverTex = this.createCoverTexture();
    const coverMat = new THREE.MeshStandardMaterial({
      map: coverTex,
      metalness: 0.45,
      roughness: 0.35
    });

    const plainCoverMat = new THREE.MeshStandardMaterial({
      color: 0x0B1220,
      metalness: 0.45,
      roughness: 0.35
    });

    // Capa Traseira e Lombada
    const back = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), plainCoverMat);
    back.position.set(0, 0, -d * 0.45);
    this.bookGroup.add(back);

    const spine = new THREE.Mesh(new THREE.BoxGeometry(0.14, h, d), plainCoverMat);
    spine.position.set(-w * 0.5, 0, 0);
    this.bookGroup.add(spine);

    // Dobradiça da capa dianteira
    this.hinge = new THREE.Group();
    this.hinge.position.set(-w * 0.5, 0, d * 0.45);

    const frontMaterials = [
      plainCoverMat, plainCoverMat, plainCoverMat, plainCoverMat,
      coverMat, // Face frontal com arte completa
      plainCoverMat
    ];
    const front = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), frontMaterials);
    front.position.set(w * 0.5, 0, 0);
    this.hinge.add(front);

    this.bookGroup.add(this.hinge);

    // CADEADO 3D REALISTA (Corpo de latão maciço + Manilha curva metálica)
    this.lockGroup = new THREE.Group();
    this.lockGroup.position.set(w * 0.46, 0, d * 0.48);

    const lockBrassMat = new THREE.MeshStandardMaterial({
      color: 0xE4C37F,
      metalness: 0.85,
      roughness: 0.25
    });

    // Corpo do cadeado
    const lockBody = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.6, 0.22), lockBrassMat);
    this.lockGroup.add(lockBody);

    // Fechadura escura
    const keyhole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.06, 0.06, 0.24, 12),
      new THREE.MeshBasicMaterial({ color: 0x0B0F19 })
    );
    keyhole.rotation.x = Math.PI / 2;
    keyhole.position.set(0, -0.05, 0.01);
    this.lockGroup.add(keyhole);

    // Manilha de arco curvo em aço
    const shackleGeo = new THREE.TorusGeometry(0.24, 0.06, 16, 24, Math.PI);
    const shackleMat = new THREE.MeshStandardMaterial({ color: 0xD1D5DB, metalness: 0.95, roughness: 0.2 });
    this.shackle = new THREE.Mesh(shackleGeo, shackleMat);
    this.shackle.position.set(0, 0.28, 0);
    this.lockGroup.add(this.shackle);

    this.bookGroup.add(this.lockGroup);

    this.bookGroup.rotation.set(0.18, -0.26, 0.04);
    this.scene.add(this.bookGroup);
  }

  unlockBook() {
    if (this.isUnlocking) return;
    this.isUnlocking = true;
    showToast('✨ Destrancando o Livro de Regras...');

    const start = performance.now();
    const anim = (now) => {
      const p = Math.min(1, (now - start) / 2200);

      this.camera.position.z = 8.5 - Math.sin(p * Math.PI * 0.5) * 2.2;

      // Animação da manilha e cadeado abrindo
      if (p < 0.4) {
        this.shackle.position.y = 0.28 + p * 0.4;
        this.shackle.rotation.y = p * 1.5;
        this.lockGroup.position.z = 0.35 + p * 2.5;
      } else {
        this.lockGroup.visible = false;
      }

      // Abertura majestosa da capa
      if (p > 0.35) {
        const p2 = (p - 0.35) / 0.65;
        this.hinge.rotation.y = -Math.pow(p2, 2.0) * (Math.PI * 0.88);
      }

      if (p < 1) requestAnimationFrame(anim);
      else if (typeof this.onUnlocked === 'function') this.onUnlocked();
    };
    requestAnimationFrame(anim);
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    if (!this.isUnlocking) {
      this.bookGroup.position.y = Math.sin(Date.now() * 0.0018) * 0.12;
      this.bookGroup.rotation.y = -0.26 + Math.cos(Date.now() * 0.0012) * 0.04;
    }
    this.renderer.render(this.scene, this.camera);
  }

  destroy() {
    if (this.renderer && this.renderer.domElement) {
      this.renderer.dispose();
      this.container.innerHTML = '';
    }
  }
}

      </div>
    `;
    document.getElementById('btn-enter-room').onclick = () => {
      state.activeTab = 'reunioes';
      state.openMeetingId = activeM.id;
      renderApp();
    };
    document.getElementById('btn-ribbon-close-meeting').onclick = () => {
      promptCloseMeeting(activeM.id);
    };
  } else {

  }
}

function renderContent() {
  const content = document.getElementById('content-slot');
  if (state.openMeetingId) {
    const meeting = state.records.find(r => r.id === state.openMeetingId);
    if (meeting) {
      renderAtaRoom(content, meeting);
      return;
    }
  }

  switch (state.activeTab) {
    case 'placar': renderPlacar(content); break;
    case 'reunioes': renderReunioes(content); break;
    case 'livro': renderLivroView(content); break;
    case 'historico': renderHistorico(content); break;
    case 'config': renderConfig(content); break;
  }
}

              <div class="vote-progress-fill" style="width:${Math.min(100, (totalVotes / Math.max(1, eligibleVoters)) * 100)}%;"></div>
            </div>
          </div>
        ` : `
          <!-- Sessão Encerrada -->
          <div class="verdict-banner ${m.result || 'cancelada'}">
            <h3>${m.result === 'culpado' ? 'Veredito: CULPADO' : m.result === 'inocente' ? 'Veredito: INOCENTE' : 'Sessão Cancelada'}</h3>
            <p>${m.result === 'culpado' ? `${escapeHtml(m.accused)} perdeu ${Math.abs(m.pointsChange || 10)} pontos no placar.` : m.result === 'inocente' ? `Nenhum ponto retirado.` : 'Reunião cancelada sem alteração de pontuação.'}</p>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;">
            <div style="background:rgba(255,255,255,0.04);padding:14px;border-radius:var(--radius);">
              <div style="font-size:12px;color:var(--red);">VOTOS CULPADO</div>
              <div style="font-size:24px;font-weight:800;color:#fff;">${guiltyVotes}</div>
            </div>
            <div style="background:rgba(255,255,255,0.04);padding:14px;border-radius:var(--radius);">
              <div style="font-size:12px;color:var(--green);">VOTOS INOCENTE</div>
              <div style="font-size:24px;font-weight:800;color:#fff;">${innocentVotes}</div>
            </div>
          </div>
          ${m.votes && Object.keys(m.votes).length > 0 ? `
            <div style="border-top:1px solid var(--border);padding-top:14px;">
              <div style="font-size:12px;font-weight:700;color:var(--text-faint);text-transform:uppercase;margin-bottom:10px;">Votos Individuais Apurados</div>
              ${Object.keys(m.votes).map(v => `
                <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13.5px;">
                  <span>${escapeHtml(v)}</span>
                  <span class="badge-status ${m.votes[v]}">${m.votes[v] === 'culpado' ? 'Culpado' : 'Inocente'}</span>
                </div>
              `).join('')}
            </div>
          ` : ''}
        `}
      </div>
    </div>
  `;

  document.getElementById('btn-back-meetings').onclick = () => { state.openMeetingId = null; renderApp(); };

  const btnClose = document.getElementById('btn-room-close-meeting');
  if (btnClose) btnClose.onclick = () => promptCloseMeeting(m.id);

  const btnCancel = document.getElementById('btn-room-cancel-meeting');
  if (btnCancel) btnCancel.onclick = () => promptCancelMeeting(m.id);

  const vC = document.getElementById('btn-vote-culpado');
  if (vC) vC.onclick = () => castVote(m.id, 'culpado');
  const vI = document.getElementById('btn-vote-inocente');
  if (vI) vI.onclick = () => castVote(m.id, 'inocente');

  const btnSendChat = document.getElementById('btn-send-chat-msg');
  const chatInput = document.getElementById('chat-text-input');
  if (btnSendChat && chatInput) {
    const handleSend = () => {
      const text = chatInput.value.trim();
      if (!text) return;
      m.chat = m.chat || [];
      m.chat.push({ author: state.me, text, at: Date.now() });
      chatInput.value = '';
      storageSet('records', state.records, true);
      renderApp();
    };
    btnSendChat.onclick = handleSend;
    chatInput.onkeydown = (e) => { if (e.key === 'Enter') handleSend(); };
  }
}

/* =========================================================================
   6. AÇÕES, VOTAÇÃO & ENCERRAMENTO DE REUNIÃO
   ========================================================================= */

async function castVote(mid, vote) {
  const m = state.records.find(r => r.id === mid);
  if (!m || m.status !== 'votacao') return;
  if (m.accused === state.me) return;
  m.votes = m.votes || {};
  m.votes[state.me] = vote;
  await storageSet('records', state.records, true);
  showToast('Voto registrado!');
  renderApp();
}

function promptCloseMeeting(mid) {
  const m = state.records.find(r => r.id === mid);
  if (!m) return;
  state.currentModal = { type: 'confirm_close', mid };
  renderModals();
}

function promptCancelMeeting(mid) {
  const m = state.records.find(r => r.id === mid);
  if (!m) return;
  state.currentModal = { type: 'confirm_cancel', mid };
  renderModals();
}

async function closeMeetingSession(mid) {
  const m = state.records.find(r => r.id === mid);
  if (!m || m.status !== 'votacao') return;
  const votes = Object.values(m.votes || {});
  const guilty = votes.filter(v => v === 'culpado').length;
  const total = votes.length;

  const isGuilty = total > 0 ? (guilty / total) >= (state.settings.percentualMaioria / 100) : false;

  m.status = 'encerrada';
  m.closedAt = Date.now();
  if (isGuilty) {
    m.result = 'culpado';
    m.pointsChange = -Math.abs(state.settings.pontosPorInfracao);
    const emp = state.employees.find(e => e.name === m.accused);
    if (emp) emp.points += m.pointsChange;
  } else {
    m.result = 'inocente';
    m.pointsChange = 0;
  }

  await Promise.all([storageSet('records', state.records, true), storageSet('employees', state.employees, true)]);
  showToast('Reunião encerrada e veredito publicado!');
  state.currentModal = null;
  renderApp();
}

async function cancelMeetingSession(mid) {
  const m = state.records.find(r => r.id === mid);
  if (!m || m.status !== 'votacao') return;
  m.status = 'cancelada';
  m.closedAt = Date.now();
  m.result = 'cancelada';
  m.pointsChange = 0;
  await storageSet('records', state.records, true);
  showToast('Reunião cancelada sem penalidades.');
  state.currentModal = null;
  renderApp();
}

function renderModals() {
  const modalSlot = document.getElementById('modal-slot');
  const welcomeSlot = document.getElementById('welcome-slot');

  if (state.welcomeOverlay) {
    const w = state.welcomeOverlay;
    welcomeSlot.innerHTML = `
      <div class="welcome-modal" id="welcome-modal-el">
        <div class="welcome-card-content tilt-3d-card">
          <div class="welcome-avatar-pulse pop-layer-3">${getInitials(w.name)}</div>
          <div style="font-size:14px;color:var(--text-muted);letter-spacing:0.06em;" class="pop-layer-2">BEM-VINDO(A) DE VOLTA</div>
          <h2 style="font-size:30px;font-weight:800;margin:6px 0 16px;" class="pop-layer-2">${escapeHtml(w.name)}</h2>
          <div style="font-size:12px;color:var(--gold);font-weight:700;" class="pop-layer-1">SALDO ATUAL</div>
          <div class="welcome-points-val pop-layer-3">${w.points} pts</div>
          <div style="font-size:13px;color:var(--text-faint);margin-top:20px;">Clique em qualquer lugar para continuar</div>
        </div>
      </div>
    `;
    document.getElementById('welcome-modal-el').onclick = () => {
      state.welcomeOverlay = null;
      renderModals();
    };
    return;
  } else {
    welcomeSlot.innerHTML = '';
  }

  if (!state.currentModal) {
    modalSlot.innerHTML = '';
    return;
  }

  // MODAL DE ENCERRAMENTO DE REUNIÃO
  if (typeof state.currentModal === 'object' && state.currentModal.type === 'confirm_close') {
    const mid = state.currentModal.mid;
    const m = state.records.find(r => r.id === mid);
    const votes = Object.values(m.votes || {});
    const guilty = votes.filter(v => v === 'culpado').length;
    const innocent = votes.filter(v => v === 'inocente').length;

    modalSlot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-panel tilt-3d-card">
          <h2 class="pop-layer-2">Encerrar Reunião</h2>
          <p class="sub pop-layer-1">Deseja finalizar a <b>Ata Nº ${String(m.numero).padStart(3, '0')}</b> e apurar o resultado agora?</p>

          <div style="background:rgba(255,255,255,0.04);padding:16px;border-radius:var(--radius);margin-bottom:18px;" class="pop-layer-1">
            <div style="font-size:13px;color:var(--text-muted);margin-bottom:8px;">Votos coletados até o momento: <b>${votes.length}</b></div>
            <div style="display:flex;gap:12px;">
              <span style="color:var(--red);font-weight:700;font-size:14px;">Culpado: ${guilty}</span>
              <span style="color:var(--green);font-weight:700;font-size:14px;">Inocente: ${innocent}</span>
            </div>
            ${votes.length < state.settings.quorumMinimo ? `
              <p style="font-size:12px;color:var(--gold);margin-top:8px;">⚠️ O quórum ideal é de ${state.settings.quorumMinimo} votos. Finalizar agora apurará com os votos existentes.</p>
            ` : ''}
          </div>

          <div class="modal-actions pop-layer-1">
            <button class="btn-modal-cancel" id="btn-cancel-close-modal">Continuar Votando</button>
            <button class="btn-close-meeting-danger" id="btn-confirm-close-modal">Finalizar e Apurar Veredito</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('btn-cancel-close-modal').onclick = () => { state.currentModal = null; renderModals(); };
    document.getElementById('btn-confirm-close-modal').onclick = () => closeMeetingSession(mid);
    return;
  }

  // MODAL DE CANCELAMENTO DE REUNIÃO
  if (typeof state.currentModal === 'object' && state.currentModal.type === 'confirm_cancel') {
    const mid = state.currentModal.mid;
    const m = state.records.find(r => r.id === mid);

    modalSlot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-panel tilt-3d-card">
          <h2 class="pop-layer-2">Cancelar Reunião</h2>
          <p class="sub pop-layer-1">Tem certeza que deseja cancelar a <b>Ata Nº ${String(m.numero).padStart(3, '0')}</b>? Nenhuma penalidade será aplicada.</p>
          <div class="modal-actions pop-layer-1">
            <button class="btn-modal-cancel" id="btn-abort-cancel-modal">Voltar</button>
            <button class="btn-cancel-meeting-soft" id="btn-confirm-cancel-modal" style="color:var(--red);border-color:rgba(248,113,113,0.4);">Confirmar Cancelamento</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('btn-abort-cancel-modal').onclick = () => { state.currentModal = null; renderModals(); };
    document.getElementById('btn-confirm-cancel-modal').onclick = () => cancelMeetingSession(mid);
    return;
  }

  // MODAL DE LOGIN CORPORATIVO
  if (state.currentModal === 'login') {
    modalSlot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-panel tilt-3d-card">
          <h2 class="pop-layer-2">Acesso Octafin</h2>
          <p class="sub pop-layer-1">Entre com seu e-mail corporativo para acessar o Comitê.</p>
          <div class="input-field pop-layer-1" style="margin-bottom:14px;">
            <label>E-mail corporativo</label>
            <input type="email" id="login-email-input" placeholder="seu.nome@octafin.com.br" autocomplete="username">
          </div>
          <div class="input-field pop-layer-1" style="margin-bottom:14px;">
            <label>Senha de acesso (padrão: 123456)</label>
            <input type="password" id="login-pass-input" placeholder="••••••••" autocomplete="current-password">
          </div>
          <div id="login-error-msg" style="color:var(--red);font-size:13px;display:none;margin-bottom:12px;"></div>
          <div class="modal-actions pop-layer-1">
            <button class="btn-action-primary" id="btn-submit-login" style="width:100%;">Entrar no Sistema</button>
          </div>
        </div>
      </div>
    `;

    const doLogin = async () => {
      const email = document.getElementById('login-email-input').value.trim().toLowerCase();
      const pass = document.getElementById('login-pass-input').value;
      const user = USERS.find(u => u.email.toLowerCase() === email);

      if (!user || user.password !== pass) {
        const err = document.getElementById('login-error-msg');
        err.textContent = 'E-mail ou senha incorretos.';
        err.style.display = 'block';
        return;
      }

      state.me = user.name;
      await storageSet('my_name', user.name, false);
      if (!state.employees.some(e => e.name === user.name)) {
        state.employees.push({ id: uid(), name: user.name, points: 0 });
        await storageSet('employees', state.employees, true);
      }
      const emp = state.employees.find(e => e.name === user.name);
      state.currentModal = null;
      state.welcomeOverlay = { name: user.name, points: emp ? emp.points : 0 };
      renderApp();
    };

    document.getElementById('btn-submit-login').onclick = doLogin;
    document.getElementById('login-pass-input').onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
  } else if (state.currentModal === 'acionar') {
    const eligible = state.employees.filter(e => e.name !== state.me);
    modalSlot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-panel tilt-3d-card">
          <h2 class="pop-layer-2">Acionar Reunião</h2>
          <p class="sub pop-layer-1">Selecione quem cometeu a falha e relate os fatos.</p>
          <div class="input-field pop-layer-1" style="margin-bottom:14px;">
            <label>Quem cometeu a falha?</label>
            <select id="ac-accused-select">
              <option value="">Selecione um colaborador...</option>
              ${eligible.map(e => `<option value="${escapeHtml(e.name)}">${escapeHtml(e.name)}</option>`).join('')}
            </select>
          </div>
          <div class="input-field pop-layer-1" style="margin-bottom:14px;">
            <label>Motivo do acionamento</label>
            <textarea id="ac-reason-text" rows="4" placeholder="Descreva os fatos com clareza..." style="resize:none;"></textarea>
          </div>
          <div class="modal-actions pop-layer-1">
            <button class="btn-modal-cancel" id="btn-cancel-ac">Cancelar</button>
            <button class="btn-action-primary" id="btn-confirm-ac">Abrir Reunião</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('btn-cancel-ac').onclick = () => { state.currentModal = null; renderApp(); };
    document.getElementById('btn-confirm-ac').onclick = async () => {
      const accused = document.getElementById('ac-accused-select').value;
      const reason = document.getElementById('ac-reason-text').value.trim();
      if (!accused || !reason) { showToast('⚠️ Preencha todos os campos.'); return; }

      const maxNo = state.records.filter(r => r.type === 'reuniao').reduce((max, r) => Math.max(max, r.numero || 0), 0);
      const newM = { id: uid(), type: 'reuniao', numero: maxNo + 1, requester: state.me, accused, reason, status: 'votacao', votes: {}, chat: [], createdAt: Date.now() };
      state.records.push(newM);
      await storageSet('records', state.records, true);
      state.currentModal = null;
      state.activeTab = 'reunioes';
      state.openMeetingId = newM.id;
      showToast('Reunião aberta!');
      renderApp();
    };
  }
}

/* =========================================================================
   7. SISTEMA DE TILT 3D ULTRA OTIMIZADO (ZERO LAG / 120 FPS)
   ========================================================================= */

function initUltraSmooth3DTilt() {
  let activeCard = null;
  let cachedRect = null;
  let targetRx = 0, targetRy = 0;
  let currentRx = 0, currentRy = 0;
  let isHovering = false;

  document.addEventListener('mousemove', (e) => {
    const card = e.target.closest('.tilt-3d-card');
    if (card !== activeCard) {
      if (activeCard) {
        activeCard.classList.remove('is-tilting');
        activeCard.style.setProperty('--rx', '0deg');
        activeCard.style.setProperty('--ry', '0deg');
      }
      activeCard = card;
      if (activeCard) {
        cachedRect = activeCard.getBoundingClientRect();
        activeCard.classList.add('is-tilting');
        isHovering = true;
      } else {
        isHovering = false;
        cachedRect = null;
      }
    }

    if (!activeCard || !cachedRect) return;

    const x = e.clientX - cachedRect.left;
    const y = e.clientY - cachedRect.top;
    const halfW = cachedRect.width / 2;
    const halfH = cachedRect.height / 2;

    targetRx = -((y - halfH) / halfH) * 8.5;
    targetRy = ((x - halfW) / halfW) * 8.5;
  }, { passive: true });

  window.addEventListener('scroll', () => {
    if (activeCard) {
      cachedRect = activeCard.getBoundingClientRect();
    }
  }, { passive: true });

  document.addEventListener('mouseleave', () => {
    if (activeCard) {
      activeCard.classList.remove('is-tilting');
      activeCard.style.setProperty('--rx', '0deg');
      activeCard.style.setProperty('--ry', '0deg');
      activeCard = null;
      isHovering = false;
    }
  });

  function renderTiltLoop() {
    if (isHovering && activeCard) {
      currentRx += (targetRx - currentRx) * 0.22;
      currentRy += (targetRy - currentRy) * 0.22;
      activeCard.style.setProperty('--rx', `${currentRx.toFixed(2)}deg`);
      activeCard.style.setProperty('--ry', `${currentRy.toFixed(2)}deg`);
    } else {
      currentRx = 0; currentRy = 0;
    }
    requestAnimationFrame(renderTiltLoop);
  }
  renderTiltLoop();
}

/* =========================================================================
   8. INICIALIZAÇÃO
   ========================================================================= */

async function startSystem() {
  await loadData();
  new FullSpace3DUniverse();
  initUltraSmooth3DTilt();
  renderApp();

  setInterval(async () => {
    if (state.currentModal || state.activeTab === 'livro' || state.welcomeOverlay) return;
    const chatInput = document.getElementById('chat-text-input');
    if (chatInput && chatInput.value.trim().length > 0) return;
    try {
      await loadData();
      renderApp();
    } catch (e) {}
  }, 5000);
}

window.addEventListener('DOMContentLoaded', startSystem);
</script>
