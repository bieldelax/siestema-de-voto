<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Comitê de Acionamento &middot; Octafin 3D Cósmico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">

<!-- Three.js para o Universo 3D contínuo de fundo e Livro de Regras -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
  :root {
    --deep-space: #050811;
    --bg-glass: rgba(13, 19, 33, 0.72);
    --bg-glass-card: rgba(17, 24, 43, 0.75);
    --bg-glass-hover: rgba(26, 38, 66, 0.82);
    --sidebar-glass: rgba(9, 14, 26, 0.82);
    --border: rgba(148, 163, 184, 0.16);
    --border-strong: rgba(148, 163, 184, 0.32);
    --border-glow: rgba(34, 211, 238, 0.45);

    --brand: #22D3EE;
    --brand-glow: rgba(34, 211, 238, 0.35);
    --teal: #1FBFAE;
    --teal-dark: #128276;
    --gold: #E4C37F;
    --gold-light: #FCE7B8;
    --gold-glow: rgba(228, 195, 127, 0.45);
    --blue: #4C6FFF;
    --blue-dark: #3753D6;
    --purple: #8B5CF6;
    --red: #F87171;
    --red-soft: rgba(248, 113, 113, 0.14);
    --green: #34D399;
    --green-soft: rgba(52, 211, 153, 0.14);

    --text: #F8FAFC;
    --text-muted: #94A3B8;
    --text-faint: #64748B;

    --radius-lg: 20px;
    --radius: 14px;
    --radius-sm: 10px;
    --radius-full: 9999px;

    --shadow-card: 0 16px 40px -6px rgba(0, 0, 0, 0.65), 0 0 0 1px var(--border);
    --shadow-glow: 0 0 30px rgba(34, 211, 238, 0.25);
    --shadow-gold: 0 0 35px rgba(228, 195, 127, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    width: 100%;
    background-color: var(--deep-space);
    color: var(--text);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* Canvas 3D de Espaço Cósmico Geral (Polvo Nadando, Nave Espacial, Planeta Explodindo) */
  #cosmic-3d-bg {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
    display: block;
  }

  #app {
    position: relative;
    z-index: 10;
    display: flex;
    min-height: 100vh;
    width: 100%;
    background: transparent;
  }

  button, input, select, textarea {
    font-family: inherit;
    font-size: inherit;
    outline: none;
  }
  button {
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }
  button:active:not(:disabled) {
    transform: scale(0.96);
  }

  /* EFEITO 3D PERSPECTIVE TILT */
  .tilt-3d-parent {
    perspective: 1100px;
  }
  .tilt-3d-card {
    transform-style: preserve-3d;
    transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateZ(var(--tz, 0px));
    transition: transform 0.12s ease-out, box-shadow 0.2s ease, border-color 0.2s ease;
    will-change: transform;
  }
  .tilt-3d-card:hover {
    --tz: 10px;
    border-color: var(--border-glow);
    box-shadow: 0 24px 50px -10px rgba(0, 0, 0, 0.7), 0 0 25px rgba(34, 211, 238, 0.15);
  }
  .pop-layer-1 { transform: translateZ(20px); }
  .pop-layer-2 { transform: translateZ(38px); }
  .pop-layer-3 { transform: translateZ(55px); }

  /* Sidebar */
  .sidebar {
    width: 270px;
    flex-shrink: 0;
    background: var(--sidebar-glass);
    border-right: 1px solid var(--border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
    padding: 26px 20px;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 30;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 26px;
  }
  .brand-icon {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(145deg, rgba(34, 211, 238, 0.25), rgba(31, 191, 174, 0.12));
    border: 1px solid rgba(34, 211, 238, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 24px rgba(34, 211, 238, 0.3);
    flex-shrink: 0;
  }
  .brand-icon svg { width: 26px; height: 26px; color: var(--brand); }
  .brand-text h2 {
    font-size: 16.5px;
    font-weight: 800;
    color: #fff;
    line-height: 1.2;
    letter-spacing: -0.01em;
  }
  .brand-text span {
    font-size: 10.5px;
    letter-spacing: 0.1em;
    color: var(--gold);
    text-transform: uppercase;
    font-weight: 700;
  }

  .identity-card {
    background: var(--bg-glass-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 13px;
    display: flex;
    align-items: center;
    gap: 11px;
    margin-bottom: 22px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(10px);
  }
  .avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
    color: #05161A;
    font-weight: 800;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(31, 191, 174, 0.3);
  }
  .avatar.lg { width: 52px; height: 52px; font-size: 18px; }
  .identity-meta { min-width: 0; flex: 1; }
  .identity-meta b {
    display: block;
    font-size: 13.5px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .identity-meta span { font-size: 12px; color: var(--brand); font-weight: 700; }
  .btn-switch-user {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 11px;
    padding: 4px 6px;
    border-radius: 6px;
  }
  .btn-switch-user:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }

  nav.nav-tabs {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: auto;
  }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    color: var(--text-muted);
    background: transparent;
    border: 1px solid transparent;
    font-size: 13.5px;
    font-weight: 600;
    text-align: left;
    transition: all 0.15s ease;
  }
  .nav-item svg { width: 17px; height: 17px; flex-shrink: 0; }
  .nav-item:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
  .nav-item.active {
    color: #fff;
    background: rgba(34, 211, 238, 0.12);
    border-color: rgba(34, 211, 238, 0.3);
    box-shadow: inset 0 0 16px rgba(34, 211, 238, 0.1);
  }
  .nav-item.active svg { color: var(--brand); }
  .nav-badge-count {
    margin-left: auto;
    background: var(--brand);
    color: #07151F;
    font-size: 10.5px;
    font-weight: 800;
    padding: 1px 7px;
    border-radius: var(--radius-full);
  }

  .btn-cta-acionar {
    margin-top: 18px;
    background: linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%);
    color: #041E1C;
    border: none;
    font-weight: 700;
    font-size: 14px;
    padding: 12px 16px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(31, 191, 174, 0.35);
  }
  .btn-cta-acionar:hover {
    filter: brightness(1.1);
    box-shadow: 0 10px 32px rgba(31, 191, 174, 0.5);
  }
  .btn-cta-acionar svg { width: 18px; height: 18px; }

  /* Main Viewport */
  .main-viewport {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .ribbon-live {
    background: linear-gradient(90deg, rgba(76, 111, 255, 0.25), rgba(34, 211, 238, 0.2));
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 11px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13.5px;
    color: #fff;
  }
  .pulse-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--brand);
    box-shadow: 0 0 12px var(--brand);
    animation: pulse 1.6s infinite ease-in-out;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.35; transform: scale(0.85); }
  }
  .btn-ribbon-enter {
    margin-left: auto;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border: 1px solid var(--border-strong);
    padding: 6px 14px;
    border-radius: var(--radius-sm);
    font-size: 12.5px;
    font-weight: 700;
  }
  .btn-ribbon-enter:hover { background: rgba(255, 255, 255, 0.22); }

  .content-container {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    padding: 42px 30px 90px;
  }
  .page-header { margin-bottom: 28px; }
  .page-header h1 {
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.5);
  }
  .page-header p {
    color: var(--text-muted);
    font-size: 14.5px;
    line-height: 1.55;
    max-width: 600px;
  }

  /* Placar */
  .leaderboard {
    background: var(--bg-glass-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    overflow: hidden;
  }
  .leader-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s ease;
  }
  .leader-row:last-child { border-bottom: none; }
  .leader-row:hover { background: var(--bg-glass-hover); }
  .leader-rank {
    width: 34px;
    text-align: center;
    font-weight: 800;
    font-size: 16px;
    color: var(--text-faint);
    flex-shrink: 0;
  }
  .leader-rank.top-1 { color: var(--gold); text-shadow: 0 0 14px var(--gold-glow); }
  .leader-rank.top-2 { color: #E2E8F0; }
  .leader-rank.top-3 { color: #CD7F32; }
  .leader-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
  .leader-name { font-size: 15.5px; font-weight: 600; color: #fff; }
  .you-badge {
    background: rgba(31, 191, 174, 0.15);
    color: var(--teal);
    border: 1px solid rgba(31, 191, 174, 0.3);
    font-size: 10px;
    font-weight: 800;
    padding: 2px 7px;
    border-radius: var(--radius-full);
    letter-spacing: 0.05em;
  }
  .leader-points {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    min-width: 85px;
    text-align: right;
  }
  .leader-points.neg { color: var(--red); }

  /* Reuniões */
  .meeting-card {
    background: var(--bg-glass-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 16px;
    cursor: pointer;
    box-shadow: var(--shadow-card);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .card-ata-no {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-faint);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .badge-status {
    font-size: 11px;
    font-weight: 800;
    padding: 3px 10px;
    border-radius: var(--radius-full);
    letter-spacing: 0.02em;
  }
  .badge-status.votacao {
    background: rgba(34, 211, 238, 0.16);
    color: var(--brand);
    border: 1px solid rgba(34, 211, 238, 0.35);
  }
  .badge-status.culpado {
    background: var(--red-soft);
    color: var(--red);
    border: 1px solid rgba(248, 113, 113, 0.35);
  }
  .badge-status.inocente {
    background: var(--green-soft);
    color: var(--green);
    border: 1px solid rgba(52, 211, 153, 0.35);
  }
  .card-reason { font-size: 14.5px; color: var(--text); margin-bottom: 12px; line-height: 1.5; }
  .card-meta { font-size: 12.5px; color: var(--text-muted); display: flex; gap: 16px; flex-wrap: wrap; }
  .card-meta b { color: #fff; }

  /* Detalhe da Ata */
  .ata-room {
    background: var(--bg-glass-card);
    border: 1px solid rgba(34, 211, 238, 0.3);
    border-radius: var(--radius-lg);
    padding: 34px 38px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 30px rgba(34, 211, 238, 0.12);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }
  .btn-back-link {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13.5px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 22px;
  }
  .btn-back-link:hover { color: #fff; }
  .ata-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 22px;
  }
  .ata-header h2 { font-size: 24px; font-weight: 800; color: #fff; }
  .ata-header .ata-date { font-size: 12.5px; color: var(--text-faint); margin-top: 4px; }
  .accused-banner {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }
  .accused-info label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint); }
  .accused-info h3 { font-size: 17px; font-weight: 700; color: #fff; }
  .reason-callout {
    border-left: 3px solid var(--brand);
    padding: 12px 18px;
    background: rgba(34, 211, 238, 0.05);
    border-radius: 0 8px 8px 0;
    font-size: 14.5px;
    line-height: 1.6;
    color: #F1F5F9;
    margin-bottom: 28px;
  }

  .chat-box {
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 24px 0;
    margin-bottom: 26px;
  }
  .chat-box-title { font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .chat-box-desc { font-size: 12.5px; color: var(--text-faint); margin-bottom: 16px; }
  .chat-stream {
    max-height: 280px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 6px;
    margin-bottom: 16px;
  }
  .chat-bubble {
    max-width: 82%;
    padding: 11px 15px;
    border-radius: 14px;
    font-size: 13.5px;
    line-height: 1.45;
  }
  .chat-bubble.from-req {
    align-self: flex-start;
    background: rgba(76, 111, 255, 0.18);
    border: 1px solid rgba(76, 111, 255, 0.4);
    border-top-left-radius: 4px;
  }
  .chat-bubble.from-acc {
    align-self: flex-end;
    background: rgba(31, 191, 174, 0.18);
    border: 1px solid rgba(31, 191, 174, 0.4);
    border-top-right-radius: 4px;
    text-align: right;
  }
  .chat-author { font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; }
  .chat-author span { font-size: 10px; opacity: 0.7; }
  .chat-input-bar { display: flex; gap: 10px; }
  .chat-input-bar input {
    flex: 1;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    color: #fff;
    font-size: 13.5px;
  }
  .chat-input-bar input:focus {
    border-color: var(--brand);
    box-shadow: 0 0 0 2px var(--brand-glow);
  }
  .btn-send-chat {
    background: var(--blue);
    color: #fff;
    border: none;
    font-weight: 700;
    padding: 0 20px;
    border-radius: var(--radius-sm);
  }
  .btn-send-chat:hover { background: var(--blue-dark); }

  .voting-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .btn-vote-option {
    padding: 16px;
    border-radius: var(--radius);
    border: 1.5px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
  }
  .btn-vote-option b { font-size: 15px; }
  .btn-vote-option span { font-size: 12px; opacity: 0.8; }
  .btn-vote-option.vote-culpado { background: var(--red-soft); color: var(--red); }
  .btn-vote-option.vote-culpado:hover { border-color: var(--red); }
  .btn-vote-option.vote-inocente { background: var(--green-soft); color: var(--green); }
  .btn-vote-option.vote-inocente:hover { border-color: var(--green); }
  .vote-progress-bar {
    height: 7px;
    background: var(--border);
    border-radius: var(--radius-full);
    overflow: hidden;
    margin: 10px 0 20px;
  }
  .vote-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--brand));
    border-radius: var(--radius-full);
    transition: width 0.3s ease;
  }
  .verdict-banner { padding: 20px 24px; border-radius: var(--radius); margin-bottom: 24px; }
  .verdict-banner.culpado { background: var(--red-soft); border: 1px solid rgba(248, 113, 113, 0.4); color: var(--red); }
  .verdict-banner.inocente { background: var(--green-soft); border: 1px solid rgba(52, 211, 153, 0.4); color: var(--green); }
  .verdict-banner h3 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }

  /* LIVRO DE REGRAS 3D NA ABA */
  .book-stage-wrapper {
    position: relative;
    width: 100%;
    min-height: 560px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid rgba(34, 211, 238, 0.35);
    background: rgba(8, 12, 22, 0.85);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(34, 211, 238, 0.15);
  }
  .book-3d-canvas-mount {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .book-overlay-ui {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .btn-unlock-book-tab {
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, #C49F57 100%);
    color: #121824;
    border: none;
    font-weight: 800;
    font-size: 14.5px;
    padding: 13px 26px;
    border-radius: var(--radius-full);
    box-shadow: 0 10px 30px var(--gold-glow);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-unlock-book-tab:hover { filter: brightness(1.1); transform: translateY(-2px); }

  /* Leitor Pautado */
  .reader-container {
    position: relative;
    padding: 40px 26px;
    min-height: 580px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(10, 15, 28, 0.9);
    backdrop-filter: blur(20px);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
  }
  .reader-paper-card {
    max-width: 580px;
    width: 100%;
    min-height: 480px;
    background: #FAF6ED;
    background-image:
      linear-gradient(#FAF6ED 1.5rem, transparent 1.5rem),
      linear-gradient(90deg, transparent 48px, #F29E9E 48px, #F29E9E 49px, transparent 49px),
      repeating-linear-gradient(transparent, transparent 27px, #E5DCBA 27px, #E5DCBA 28px);
    background-size: 100% 28px;
    color: #241D15;
    border-radius: 12px;
    padding: 38px 42px 42px 64px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 0 30px rgba(184, 151, 98, 0.15);
    margin-bottom: 24px;
  }
  .paper-page-content h2 { font-family: 'Cinzel', serif; font-size: 24px; font-weight: 700; color: #1A150E; margin-bottom: 16px; }

<script>
/* =========================================================================
   1. UNIVERSO 3D DE FUNDO (POLVO CÓSMICO + NAVE ESPACIAL + PLANETA EXPLODINDO)
   ========================================================================= */

class FullSpace3DUniverse {
  constructor() {
    this.canvas = document.getElementById('cosmic-3d-bg');
    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    this.camera.position.set(0, 0, 24);

    this.renderer = new THREE.WebGLRenderer({ canvas: this.canvas, antialias: true, alpha: true });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    this.clock = new THREE.Clock();
    this.mouse = { x: 0, y: 0, targetX: 0, targetY: 0 };

    this.initLights();
    this.initStarfield();
    this.initCosmicOctopus();
    this.initSpaceship();
    this.initExplodingPlanet();
    this.bindEvents();
    this.animate();
  }

  initLights() {
    const amb = new THREE.AmbientLight(0x1B243B, 1.8);
    this.scene.add(amb);

    this.cyanLight = new THREE.DirectionalLight(0x22D3EE, 2.5);
    this.cyanLight.position.set(-15, 10, 10);
    this.scene.add(this.cyanLight);

    this.goldLight = new THREE.DirectionalLight(0xE4C37F, 3.0);
    this.goldLight.position.set(15, -8, 12);
    this.scene.add(this.goldLight);

    this.planetFlash = new THREE.PointLight(0xFF5500, 3.5, 40);
    this.planetFlash.position.set(16, 7, -8);
    this.scene.add(this.planetFlash);
  }

  initStarfield() {
    this.starGroup = new THREE.Group();
    const starCounts = [900, 500, 250];
    const colors = [0xFFFFFF, 0xA5F3FC, 0xFDE68A];
    const sizes = [0.08, 0.12, 0.18];

    starCounts.forEach((count, i) => {
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      for (let j = 0; j < count * 3; j += 3) {
        pos[j] = (Math.random() - 0.5) * 110;
        pos[j + 1] = (Math.random() - 0.5) * 80;
        pos[j + 2] = -10 - Math.random() * 50 - i * 20;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({
        color: colors[i],
        size: sizes[i],
        transparent: true,
        opacity: 0.85
      });
      this.starGroup.add(new THREE.Points(geo, mat));
    });
    this.scene.add(this.starGroup);
  }

  /* 1. POLVO CÓSMICO 3D (Nada suavemente pelo fundo do espaço) */
  initCosmicOctopus() {
    this.octopus = new THREE.Group();

    // Cabeça do polvo
    const headGeo = new THREE.SphereGeometry(1.6, 32, 24);
    headGeo.scale(1.1, 0.9, 1.4);
    const octoMat = new THREE.MeshStandardMaterial({
      color: 0x0F2942,
      roughness: 0.35,
      metalness: 0.6,
      emissive: 0x071524
    });
    this.octoHead = new THREE.Mesh(headGeo, octoMat);
    this.octopus.add(this.octoHead);

    // Olhos azuis brilhantes
    const eyeGeo = new THREE.SphereGeometry(0.24, 16, 16);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x22D3EE });
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.65, 0.25, 1.2);
    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.65, 0.25, 1.2);
    this.octopus.add(leftEye);
    this.octopus.add(rightEye);

    // 8 Tentáculos tridimensionais articulados
    this.tentacles = [];
    const goldSuckerMat = new THREE.MeshStandardMaterial({
      color: 0xE4C37F,
      metalness: 0.8,
      roughness: 0.25
    });

    for (let t = 0; t < 8; t++) {
      const angle = (t / 8) * Math.PI * 2;
      const tentacleGroup = new THREE.Group();
      tentacleGroup.position.set(Math.cos(angle) * 1.1, -0.4, Math.sin(angle) * 0.9);

      const segments = [];
      let parent = tentacleGroup;
      for (let s = 0; s < 7; s++) {
        const segGeo = new THREE.CylinderGeometry(0.18 - s * 0.02, 0.22 - s * 0.02, 0.7, 12);
        segGeo.translate(0, -0.35, 0);
        const segMesh = new THREE.Mesh(segGeo, octoMat);

        const sucker = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 8), goldSuckerMat);
        sucker.position.set(0, -0.35, 0.16);
        segMesh.add(sucker);

        parent.add(segMesh);
        segments.push(segMesh);
        parent = segMesh;
      }

      this.octopus.add(tentacleGroup);
      this.tentacles.push({ group: tentacleGroup, segments, baseAngle: angle });
    }

    this.octopus.position.set(-18, -4, -6);
    this.octopus.scale.setScalar(1.2);
    this.scene.add(this.octopus);
  }

  /* 2. NAVE ESPACIAL 3D */
  initSpaceship() {
    this.ship = new THREE.Group();

    const hullGeo = new THREE.ConeGeometry(0.7, 3.8, 4);
    hullGeo.rotateX(Math.PI / 2);
    const hullMat = new THREE.MeshStandardMaterial({
      color: 0x1E293B,
      roughness: 0.2,
      metalness: 0.85
    });
    const hull = new THREE.Mesh(hullGeo, hullMat);
    this.ship.add(hull);

    const wingGeo = new THREE.BoxGeometry(3.6, 0.06, 1.4);
    const wingMat = new THREE.MeshStandardMaterial({
      color: 0x0F172A,
      metalness: 0.9,
      roughness: 0.3
    });
    const wings = new THREE.Mesh(wingGeo, wingMat);
    wings.position.set(0, -0.1, -0.4);
    this.ship.add(wings);

    const canopyGeo = new THREE.SphereGeometry(0.35, 16, 16);
    canopyGeo.scale(0.8, 0.6, 1.8);
    const canopyMat = new THREE.MeshBasicMaterial({ color: 0x22D3EE });
    const canopy = new THREE.Mesh(canopyGeo, canopyMat);
    canopy.position.set(0, 0.3, 0.3);
    this.ship.add(canopy);

    const flameGeo = new THREE.ConeGeometry(0.3, 1.5, 12);
    flameGeo.rotateX(-Math.PI / 2);
    const flameMat = new THREE.MeshBasicMaterial({ color: 0x00F0FF, transparent: true, opacity: 0.85 });
    this.thrusterFlame = new THREE.Mesh(flameGeo, flameMat);
    this.thrusterFlame.position.set(0, 0, -2.4);
    this.ship.add(this.thrusterFlame);

    this.ship.position.set(-30, 8, -14);
    this.ship.rotation.set(0.1, 0.9, -0.3);
    this.scene.add(this.ship);
  }

  /* 3. PLANETA EXPLODINDO 3D */
  initExplodingPlanet() {
    this.planetGroup = new THREE.Group();
    this.planetGroup.position.set(16, 7, -10);

    const coreGeo = new THREE.SphereGeometry(2.4, 32, 32);
    const coreMat = new THREE.MeshStandardMaterial({
      color: 0x991B1B,
      emissive: 0xDC2626,
      emissiveIntensity: 0.6,
      roughness: 0.6
    });
    this.planetCore = new THREE.Mesh(coreGeo, coreMat);
    this.planetGroup.add(this.planetCore);

    const ringGeo = new THREE.RingGeometry(2.6, 3.2, 36);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xF97316,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.7
    });
    this.shockwave = new THREE.Mesh(ringGeo, ringMat);
    this.shockwave.rotation.x = Math.PI / 2.3;
    this.planetGroup.add(this.shockwave);

    this.debrisCount = 55;
    this.debris = [];
    const debrisGeo = new THREE.DodecahedronGeometry(0.16);
    const debrisMat = new THREE.MeshStandardMaterial({
      color: 0xF59E0B,
      emissive: 0xB45309,
      metalness: 0.4
    });

    for (let i = 0; i < this.debrisCount; i++) {
      const d = new THREE.Mesh(debrisGeo, debrisMat);
      const dir = new THREE.Vector3(
        (Math.random() - 0.5) * 2,
        (Math.random() - 0.5) * 2,
        (Math.random() - 0.5) * 2
      ).normalize();
      const speed = 0.04 + Math.random() * 0.08;
      d.position.copy(dir.clone().multiplyScalar(2.4));
      this.planetGroup.add(d);
      this.debris.push({ mesh: d, dir, speed, dist: 2.4 });
    }

    this.scene.add(this.planetGroup);
  }

  bindEvents() {
    window.addEventListener('resize', () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const onMove = (clientX, clientY) => {
      this.mouse.targetX = (clientX / window.innerWidth - 0.5) * 2.0;
      this.mouse.targetY = (clientY / window.innerHeight - 0.5) * 2.0;

      // EFEITO 3D TILT NOS CARDS
      document.querySelectorAll('.tilt-3d-card').forEach(card => {
        const rect = card.getBoundingClientRect();
        if (clientX >= rect.left && clientX <= rect.right && clientY >= rect.top && clientY <= rect.bottom) {
          const rx = -((clientY - (rect.top + rect.height / 2)) / (rect.height / 2)) * 14;
          const ry = ((clientX - (rect.left + rect.width / 2)) / (rect.width / 2)) * 14;
          card.style.setProperty('--rx', `${rx.toFixed(2)}deg`);
          card.style.setProperty('--ry', `${ry.toFixed(2)}deg`);
        } else {
          card.style.setProperty('--rx', '0deg');
          card.style.setProperty('--ry', '0deg');
        }
      });
    };

    window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) onMove(e.touches[0].clientX, e.touches[0].clientY);
    });
  }

  animate() {
    requestAnimationFrame(() => this.animate());

    const time = this.clock.getElapsedTime();

    this.mouse.x += (this.mouse.targetX - this.mouse.x) * 0.05;
    this.mouse.y += (this.mouse.targetY - this.mouse.y) * 0.05;

    this.camera.position.x = this.mouse.x * 2.2;
    this.camera.position.y = -this.mouse.y * 1.8;
    this.camera.lookAt(0, 0, 0);

    this.starGroup.rotation.y = time * 0.015 + this.mouse.x * 0.05;

    // Polvo Cósmico
    this.octopus.position.x = -18 + Math.sin(time * 0.35) * 14;
    this.octopus.position.y = -3.5 + Math.cos(time * 0.5) * 2.5;
    this.octopus.position.z = -6 + Math.sin(time * 0.25) * 4;
    this.octopus.rotation.y = Math.cos(time * 0.35) * 0.4 + 0.3;
    this.octopus.rotation.z = Math.sin(time * 0.4) * 0.15;

    this.tentacles.forEach((tData) => {
      tData.segments.forEach((seg, sIdx) => {
        seg.rotation.z = Math.sin(time * 2.5 + sIdx * 0.45 + tData.baseAngle) * 0.18;
        seg.rotation.x = Math.cos(time * 2.0 + sIdx * 0.4) * 0.14;
      });
    });

    // Nave Espacial
    this.ship.position.x = -28 + ((time * 7) % 65);
    this.ship.position.y = 7 + Math.sin(time * 1.5) * 2.0;
    this.ship.position.z = -14 + Math.cos(time * 1.2) * 3.0;
    this.ship.rotation.z = -0.3 + Math.sin(time * 2.0) * 0.2;
    this.thrusterFlame.scale.set(1 + Math.random() * 0.3, 1 + Math.random() * 0.4, 1 + Math.random() * 0.3);

    // Planeta Explodindo
    const cycle = (time * 0.65) % (Math.PI * 2);
    const pulse = Math.sin(cycle);
    this.planetCore.scale.setScalar(1 + Math.max(0, pulse) * 0.22);
    this.shockwave.scale.setScalar(1 + (time * 1.8 % 3.5));
    this.shockwave.material.opacity = Math.max(0, 1 - ((time * 1.8 % 3.5) / 3.5));

    this.debris.forEach(d => {
      d.dist += d.speed;
      if (d.dist > 7.5) d.dist = 2.4;
      d.mesh.position.copy(d.dir.clone().multiplyScalar(d.dist));
      d.mesh.rotation.x += 0.05;
      d.mesh.rotation.y += 0.05;
    });

    this.renderer.render(this.scene, this.camera);
  }
}

async function storageGet(key, isShared) {
  try {
    if (window.storage && typeof window.storage.get === 'function') {
      const res = await window.storage.get(key, isShared);
      return res ? JSON.parse(res.value) : null;
    }
  } catch (e) {
    console.warn('Storage fallback:', e);
  }
  const raw = localStorage.getItem(`octa_${key}`);
  return raw ? JSON.parse(raw) : null;
}

async function storageSet(key, value, isShared) {
  try {
    if (window.storage && typeof window.storage.set === 'function') {
      await window.storage.set(key, JSON.stringify(value), isShared);
    }
  } catch (e) {
    console.warn('Storage fallback:', e);
  }
  try {
    localStorage.setItem(`octa_${key}`, JSON.stringify(value));
    return true;
  } catch(e) {
    return false;
  }
}

async function loadData() {
  const [emp, rec, cfg, me] = await Promise.all([
    storageGet('employees', true),
    storageGet('records', true),
    storageGet('settings', true),
    storageGet('my_name', false)
  ]);

  if (emp && Array.isArray(emp) && emp.length > 0) {
    state.employees = emp;
  } else if (state.employees.length === 0) {
    state.employees = USERS.map(u => ({ id: uid(), name: u.name, points: 0 }));
    storageSet('employees', state.employees, true);
  }

  if (rec && Array.isArray(rec)) state.records = rec;
  if (cfg && cfg.pontosPorInfracao !== undefined) state.settings = cfg;
  if (me) state.me = me;
}

function uid() { return Math.random().toString(36).slice(2, 10); }
function getInitials(name) { return (name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase(); }

function showToast(msg) {
  const el = document.getElementById('toast-el');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => el.classList.remove('show'), 2800);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

   4. CENA 3D ESPECÍFICA DO LIVRO DE REGRAS (Aba "Livro de Regras")
   ========================================================================= */

class TabBook3DScene {
  constructor(containerEl, onUnlockedCallback) {
    this.container = containerEl;
    this.onUnlocked = onUnlockedCallback;
    this.width = containerEl.clientWidth;
    this.height = containerEl.clientHeight;
    this.isUnlocking = false;

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(45, this.width / this.height, 0.1, 100);
    this.camera.position.set(0, 0, 8.5);

    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    this.renderer.setSize(this.width, this.height);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.container.appendChild(this.renderer.domElement);

    const amb = new THREE.AmbientLight(0xFFFFFF, 1.2);
    this.scene.add(amb);
    const dir = new THREE.DirectionalLight(0xE4C37F, 2.5);
    dir.position.set(5, 7, 6);
    this.scene.add(dir);

    this.createBook();
    this.animate();
  }

  createBook() {
    this.bookGroup = new THREE.Group();
    const w = 3.6, h = 4.8, d = 0.65;

    const pGeo = new THREE.BoxGeometry(w * 0.94, h * 0.96, d * 0.85);
    const pMat = new THREE.MeshStandardMaterial({ color: 0xE8DEC4, roughness: 0.9 });
    this.pages = new THREE.Mesh(pGeo, pMat);
    this.bookGroup.add(this.pages);

    const cMat = new THREE.MeshStandardMaterial({ color: 0x0E1726, metalness: 0.3, roughness: 0.4 });
    const back = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), cMat);
    back.position.set(0, 0, -d * 0.45);
    this.bookGroup.add(back);

    const spine = new THREE.Mesh(new THREE.BoxGeometry(0.12, h, d), cMat);
    spine.position.set(-w * 0.5, 0, 0);
    this.bookGroup.add(spine);

    this.hinge = new THREE.Group();
    this.hinge.position.set(-w * 0.5, 0, d * 0.45);

    const front = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), cMat);
    front.position.set(w * 0.5, 0, 0);
    this.hinge.add(front);

    this.bookGroup.add(this.hinge);

    this.lock = new THREE.Mesh(
      new THREE.CylinderGeometry(0.55, 0.55, 0.25, 24),
      new THREE.MeshStandardMaterial({ color: 0xD4AF37, metalness: 0.85, roughness: 0.2 })
    );
    this.lock.rotation.x = Math.PI / 2;
    this.lock.position.set(w * 0.48, 0, 0.45);
    this.bookGroup.add(this.lock);

    this.bookGroup.rotation.set(0.2, -0.28, 0.05);
    this.scene.add(this.bookGroup);
  }

  unlockBook() {
    if (this.isUnlocking) return;
    this.isUnlocking = true;
    showToast('✨ Destrancando o Livro de Regras...');

    const start = performance.now();
    const anim = (now) => {
      const p = Math.min(1, (now - start) / 2200);

      this.camera.position.z = 8.5 - Math.sin(p * Math.PI * 0.5) * 2.2;
      if (p < 0.4) {
        this.lock.position.z = 0.45 + p * 2.0;
        this.lock.rotation.z = p * 2;
      } else {
        this.lock.visible = false;
      }

      if (p > 0.3) {
        const p2 = (p - 0.3) / 0.7;
        this.hinge.rotation.y = -Math.pow(p2, 2.2) * (Math.PI * 0.85);
      }

      if (p < 1) requestAnimationFrame(anim);
      else if (typeof this.onUnlocked === 'function') this.onUnlocked();
    };
    requestAnimationFrame(anim);
  }

  animate() {
    requestAnimationFrame(() => this.animate());
    if (!this.isUnlocking) {
      this.bookGroup.position.y = Math.sin(Date.now() * 0.002) * 0.12;
    }
    this.renderer.render(this.scene, this.camera);
  }

  destroy() {
    if (this.renderer && this.renderer.domElement) {
      this.renderer.dispose();
      this.container.innerHTML = '';
    }
  }
}

              ✅ Seu voto foi registrado em sigilo: <b>${myVote === 'culpado' ? 'Culpado' : 'Inocente'}</b>.
            </div>
          ` : `
            <h3 style="font-size:16px;margin-bottom:12px;color:#fff;">Registrar Voto Sigiloso</h3>
            <div class="voting-buttons">
              <button class="btn-vote-option vote-culpado" id="btn-vote-culpado"><b>Culpado</b><span>Confirma o erro</span></button>
              <button class="btn-vote-option vote-inocente" id="btn-vote-inocente"><b>Inocente</b><span>Sem responsabilidade</span></button>
            </div>
          `}

          <div style="margin-top:18px;">
            <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);">
              <span>Quórum</span>
              <span>${totalVotes} de ${eligibleVoters} votos</span>
            </div>
            <div class="vote-progress-bar">
              <div class="vote-progress-fill" style="width:${Math.min(100, (totalVotes / Math.max(1, eligibleVoters)) * 100)}%;"></div>
            </div>
          </div>

          ${isRequester ? `
            <div style="margin-top:20px;">
              <button class="btn-action-primary" id="btn-close-session" ${quorumMet ? '' : 'disabled style="opacity:0.4;cursor:not-allowed;"'}>
                Encerrar Votação e Apurar Resultados
              </button>
              ${!quorumMet ? `<p style="font-size:12px;color:var(--brand);margin-top:6px;">Quórum mínimo de ${state.settings.quorumMinimo} votos necessário.</p>` : ''}
            </div>
          ` : ''}
        ` : `
          <!-- Sessão Encerrada -->
          <div class="verdict-banner ${m.result}">
            <h3>${m.result === 'culpado' ? 'Veredito: CULPADO' : 'Veredito: INOCENTE'}</h3>
            <p>${m.result === 'culpado' ? `${escapeHtml(m.accused)} perdeu ${Math.abs(m.pointsChange)} pontos.` : `Nenhum ponto retirado.`}</p>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;">
            <div style="background:rgba(255,255,255,0.04);padding:14px;border-radius:var(--radius);">
              <div style="font-size:12px;color:var(--red);">CULPADO</div>
              <div style="font-size:24px;font-weight:800;color:#fff;">${guiltyVotes}</div>
            </div>
            <div style="background:rgba(255,255,255,0.04);padding:14px;border-radius:var(--radius);">
              <div style="font-size:12px;color:var(--green);">INOCENTE</div>
              <div style="font-size:24px;font-weight:800;color:#fff;">${innocentVotes}</div>
            </div>
          </div>
          <div style="border-top:1px solid var(--border);padding-top:14px;">
            <div style="font-size:12px;font-weight:700;color:var(--text-faint);text-transform:uppercase;margin-bottom:10px;">Votos Individuais</div>
            ${Object.keys(m.votes).map(v => `
              <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13.5px;">
                <span>${escapeHtml(v)}</span>
                <span class="badge-status ${m.votes[v]}">${m.votes[v] === 'culpado' ? 'Culpado' : 'Inocente'}</span>
              </div>
            `).join('')}
          </div>
        `}
      </div>
    </div>
  `;

  document.getElementById('btn-back-meetings').onclick = () => { state.openMeetingId = null; renderApp(); };
  const vC = document.getElementById('btn-vote-culpado');
  if (vC) vC.onclick = () => castVote(m.id, 'culpado');
  const vI = document.getElementById('btn-vote-inocente');
  if (vI) vI.onclick = () => castVote(m.id, 'inocente');

  const btnSendChat = document.getElementById('btn-send-chat-msg');
  const chatInput = document.getElementById('chat-text-input');
  if (btnSendChat && chatInput) {
    const handleSend = () => {
      const text = chatInput.value.trim();
      if (!text) return;
      m.chat = m.chat || [];
      m.chat.push({ author: state.me, text, at: Date.now() });
      chatInput.value = '';
      storageSet('records', state.records, true);
      renderApp();
    };
    btnSendChat.onclick = handleSend;
    chatInput.onkeydown = (e) => { if (e.key === 'Enter') handleSend(); };
  }

  const btnClose = document.getElementById('btn-close-session');
  if (btnClose && quorumMet) btnClose.onclick = () => closeMeetingSession(m.id);
}

/* 4. Livro de Regras 3D (Aba Dedicada) */
function renderLivroView(container) {
  if (state.readerMode) {
    const page = CODE_PAGES[state.readerPageIndex] || CODE_PAGES[0];
    const total = CODE_PAGES.length;

    container.innerHTML = `
      <div class="page-header">
        <h1>Livro de Regras &middot; Leitor Oficial</h1>
        <p>Código de Conduta e Convivência Corporativa da Octafin.</p>
      </div>
      <div class="reader-container">
        <div class="reader-progress-track">
          <div class="reader-progress-bar" style="width:${((state.readerPageIndex + 1) / total) * 100}%"></div>
        </div>
        <div class="reader-paper-card tilt-3d-card">
          <div class="paper-page-content">${page.content}</div>
        </div>
        <div class="reader-nav-controls">
          <button class="btn-reader-nav" id="btn-reader-prev" ${state.readerPageIndex === 0 ? 'disabled' : ''}>&larr; Anterior</button>
          <span style="color:#fff;font-size:13.5px;font-weight:700;">${state.readerPageIndex + 1} / ${total}</span>
          <button class="btn-reader-nav primary" id="btn-reader-next" ${state.readerPageIndex === total - 1 ? 'disabled' : ''}>Próxima &rarr;</button>
          <button class="btn-reader-nav" id="btn-reader-close-3d" style="margin-left:14px;">Ver Modelo 3D</button>
        </div>
      </div>
    `;

    document.getElementById('btn-reader-prev').onclick = () => { if (state.readerPageIndex > 0) { state.readerPageIndex--; renderApp(); } };
    document.getElementById('btn-reader-next').onclick = () => { if (state.readerPageIndex < total - 1) { state.readerPageIndex++; renderApp(); } };
    document.getElementById('btn-reader-close-3d').onclick = () => { state.readerMode = false; renderApp(); };
  } else {
    container.innerHTML = `
      <div class="page-header">
        <h1>Livro de Regras 3D Interativo</h1>
        <p>Clique no botão para destrancar a animação 3D ou abra o leitor direto.</p>
      </div>
      <div class="book-stage-wrapper">
        <div class="book-3d-canvas-mount" id="book-canvas-slot"></div>
        <div class="book-overlay-ui">
          <button class="btn-unlock-book-tab" id="btn-trigger-unlock-tab">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            Destrancar e Abrir Livro 3D
          </button>
          <button class="btn-action-primary" id="btn-open-reader-direct" style="background:rgba(255,255,255,0.12);color:#fff;">Abrir Leitor Pautado &rarr;</button>
        </div>
      </div>
    `;

    setTimeout(() => {
      const mount = document.getElementById('book-canvas-slot');
      if (mount) {
        if (tabBookSceneInstance) tabBookSceneInstance.destroy();
        tabBookSceneInstance = new TabBook3DScene(mount, () => {
          setTimeout(() => { state.readerMode = true; renderApp(); }, 600);
        });
      }
    }, 40);

    document.getElementById('btn-trigger-unlock-tab').onclick = () => {
      if (tabBookSceneInstance) tabBookSceneInstance.unlockBook();
    };
    document.getElementById('btn-open-reader-direct').onclick = () => {
      state.readerMode = true;
      renderApp();
    };
  }
}

/* 5. Histórico 3D */
function renderHistorico(container) {
  const records = state.records.filter(r => (r.type === 'reuniao' && r.status === 'encerrada') || r.type === 'ajuste')
    .sort((a, b) => (b.closedAt || b.createdAt) - (a.closedAt || a.createdAt));

  container.innerHTML = `
    <div class="page-header">
      <h1>Histórico de Vereditos</h1>
      <p>Todas as decisões passadas registradas de forma auditável.</p>
    </div>
    ${records.length === 0 ? '<div style="text-align:center;padding:50px;color:var(--text-muted);">Nenhum histórico ainda.</div>' : `
      <div class="meetings-list">
        ${records.map(r => `
          <div class="meeting-card tilt-3d-card" ${r.type === 'reuniao' ? `data-mid="${r.id}"` : ''}>
            <div class="card-top pop-layer-2">
              <span class="card-ata-no">${r.type === 'reuniao' ? `ATA Nº ${String(r.numero).padStart(3, '0')}` : 'Ajuste Manual'}</span>
              <span class="badge-status ${r.type === 'reuniao' ? r.result : (r.delta >= 0 ? 'inocente' : 'culpado')}">
                ${r.type === 'reuniao' ? (r.result === 'culpado' ? `Culpado (${r.pointsChange} pts)` : 'Inocente') : (r.delta >= 0 ? `+${r.delta} pts` : `${r.delta} pts`)}
              </span>
            </div>
            <div class="card-reason pop-layer-1">${escapeHtml(r.type === 'reuniao' ? r.reason : r.motivo)}</div>
            <div class="card-meta pop-layer-1">
              <span>Alvo: <b>${escapeHtml(r.target || r.accused)}</b></span>
              <span>Data: ${new Date(r.closedAt || r.createdAt).toLocaleDateString('pt-BR')}</span>
            </div>
          </div>
        `).join('')}
      </div>
    `}
  `;

  container.querySelectorAll('.meeting-card[data-mid]').forEach(card => {
    card.onclick = () => { state.openMeetingId = card.dataset.mid; renderApp(); };
  });
}

/* 6. Configurações */
function renderConfig(container) {
  const cfg = state.settings;
  container.innerHTML = `
    <div class="page-header">
      <h1>Configurações</h1>
      <p>Ajustes administrativos do comitê.</p>
    </div>

    <div class="config-card tilt-3d-card">
      <h3 class="pop-layer-2">Regras de Votação</h3>
      <p class="desc pop-layer-1">Definição dos pontos e quórum mínimo.</p>
      <div class="grid-2 pop-layer-1">
        <div class="input-field">
          <label>Pontos por infração</label>
          <input type="number" id="cfg-pontos-input" value="${cfg.pontosPorInfracao}" min="1">
        </div>
        <div class="input-field">
          <label>Quórum mínimo de votos</label>
          <input type="number" id="cfg-quorum-input" value="${cfg.quorumMinimo}" min="1">
        </div>
      </div>
      <div style="margin-top:18px;text-align:right;">
        <button class="btn-action-primary" id="btn-save-cfg">Salvar Regras</button>
      </div>
    </div>

    <div class="config-card tilt-3d-card">
      <h3 class="pop-layer-2">Colaboradores</h3>
      <div style="display:flex;gap:10px;margin-bottom:14px;margin-top:10px;" class="pop-layer-1">
        <input type="text" id="new-emp-name-input" placeholder="Nome do novo colaborador..." style="flex:1;padding:10px 14px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:var(--radius-sm);color:#fff;">
        <button class="btn-action-primary" id="btn-add-emp">Adicionar</button>
      </div>
      <div style="max-height:200px;overflow-y:auto;" class="pop-layer-1">
        ${state.employees.map(e => `
          <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--border);">
            <div class="avatar" style="width:28px;height:28px;font-size:11px;">${getInitials(e.name)}</div>
            <span style="flex:1;font-size:13.5px;color:#fff;">${escapeHtml(e.name)}</span>
            <span style="font-weight:700;font-size:14px;color:var(--brand);">${e.points} pts</span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="config-card tilt-3d-card">
      <h3 class="pop-layer-2">Ajuste Manual</h3>
      <div class="grid-2 pop-layer-1">
        <div class="input-field">
          <label>Colaborador</label>
          <select id="adj-user-select">
            <option value="">Selecione...</option>
            ${state.employees.map(e => `<option value="${escapeHtml(e.name)}">${escapeHtml(e.name)}</option>`).join('')}
          </select>
        </div>
        <div class="input-field">
          <label>Pontos (+/-)</label>
          <input type="number" id="adj-points-input" placeholder="Ex: -10 ou 5">
        </div>
      </div>
      <div class="input-field pop-layer-1" style="margin-top:12px;">
        <label>Motivo</label>
        <input type="text" id="adj-reason-input" placeholder="Justificativa...">
      </div>
      <div style="margin-top:18px;text-align:right;">
        <button class="btn-action-primary" id="btn-apply-adj">Aplicar Ajuste</button>
      </div>
    </div>
  `;

  document.getElementById('btn-save-cfg').onclick = async () => {
    state.settings.pontosPorInfracao = parseInt(document.getElementById('cfg-pontos-input').value, 10) || 10;
    state.settings.quorumMinimo = parseInt(document.getElementById('cfg-quorum-input').value, 10) || 3;
    await storageSet('settings', state.settings, true);
    showToast('Regras salvas!');
  };

  document.getElementById('btn-add-emp').onclick = async () => {
    const input = document.getElementById('new-emp-name-input');
    const name = input.value.trim();
    if (!name) return;
    state.employees.push({ id: uid(), name, points: 0 });
    await storageSet('employees', state.employees, true);
    input.value = '';
    showToast(`${name} adicionado ao time!`);
    renderApp();
  };

  document.getElementById('btn-apply-adj').onclick = async () => {
    const target = document.getElementById('adj-user-select').value;
    const delta = parseInt(document.getElementById('adj-points-input').value, 10);
    const motivo = document.getElementById('adj-reason-input').value.trim();
    if (!target || isNaN(delta) || delta === 0) return;
    const emp = state.employees.find(e => e.name === target);
    if (!emp) return;
    emp.points += delta;
    state.records.push({ id: uid(), type: 'ajuste', target, delta, motivo: motivo || 'Ajuste', by: state.me, createdAt: Date.now() });
    await Promise.all([storageSet('employees', state.employees, true), storageSet('records', state.records, true)]);
    showToast('Ajuste aplicado!');
    renderApp();
  };
}

/* =========================================================================
   6. AÇÕES & MODAIS
   ========================================================================= */

async function castVote(mid, vote) {
  const m = state.records.find(r => r.id === mid);
  if (!m || m.status !== 'votacao') return;
  if (m.accused === state.me) return;
  m.votes = m.votes || {};
  m.votes[state.me] = vote;
  await storageSet('records', state.records, true);
  showToast('Voto registrado!');
  renderApp();
}

async function closeMeetingSession(mid) {
  const m = state.records.find(r => r.id === mid);
  if (!m || m.status !== 'votacao') return;
  const votes = Object.values(m.votes || {});
  const guilty = votes.filter(v => v === 'culpado').length;
  const isGuilty = (guilty / votes.length) >= (state.settings.percentualMaioria / 100);

  m.status = 'encerrada';
  m.closedAt = Date.now();
  if (isGuilty) {
    m.result = 'culpado';
    m.pointsChange = -Math.abs(state.settings.pontosPorInfracao);
    const emp = state.employees.find(e => e.name === m.accused);
    if (emp) emp.points += m.pointsChange;
  } else {
    m.result = 'inocente';
    m.pointsChange = 0;
  }
  await Promise.all([storageSet('records', state.records, true), storageSet('employees', state.employees, true)]);
  showToast('Sessão finalizada!');
  renderApp();
}

function renderModals() {
  const modalSlot = document.getElementById('modal-slot');
  const welcomeSlot = document.getElementById('welcome-slot');

  if (state.welcomeOverlay) {
    const w = state.welcomeOverlay;
    welcomeSlot.innerHTML = `
      <div class="welcome-modal" id="welcome-modal-el">
        <div class="welcome-card-content tilt-3d-card">
          <div class="welcome-avatar-pulse pop-layer-3">${getInitials(w.name)}</div>
          <div style="font-size:14px;color:var(--text-muted);letter-spacing:0.06em;" class="pop-layer-2">BEM-VINDO(A) DE VOLTA</div>
          <h2 style="font-size:30px;font-weight:800;margin:6px 0 16px;" class="pop-layer-2">${escapeHtml(w.name)}</h2>
          <div style="font-size:12px;color:var(--gold);font-weight:700;" class="pop-layer-1">SALDO ATUAL</div>
          <div class="welcome-points-val pop-layer-3">${w.points} pts</div>
          <div style="font-size:13px;color:var(--text-faint);margin-top:20px;">Clique em qualquer lugar para continuar</div>
        </div>
      </div>
    `;
    document.getElementById('welcome-modal-el').onclick = () => {
      state.welcomeOverlay = null;
      renderModals();
    };
    return;
  } else {
    welcomeSlot.innerHTML = '';
  }

  if (!state.currentModal) {
    modalSlot.innerHTML = '';
    return;
  }

  if (state.currentModal === 'login') {
    modalSlot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-panel tilt-3d-card">
          <h2 class="pop-layer-2">Acesso Octafin</h2>
          <p class="sub pop-layer-1">Entre com seu e-mail corporativo para acessar o Comitê.</p>
          <div class="input-field pop-layer-1" style="margin-bottom:14px;">
            <label>E-mail corporativo</label>
            <input type="email" id="login-email-input" placeholder="seu.nome@octafin.com.br" autocomplete="username">
          </div>
          <div class="input-field pop-layer-1" style="margin-bottom:14px;">
            <label>Senha de acesso (padrão: 12345)</label>
            <input type="password" id="login-pass-input" placeholder="••••••••" autocomplete="current-password">
          </div>
          <div id="login-error-msg" style="color:var(--red);font-size:13px;display:none;margin-bottom:12px;"></div>
          <div class="modal-actions pop-layer-1">
            <button class="btn-action-primary" id="btn-submit-login" style="width:100%;">Entrar no Sistema</button>
          </div>
        </div>
      </div>
    `;

    const doLogin = async () => {
      const email = document.getElementById('login-email-input').value.trim().toLowerCase();
      const pass = document.getElementById('login-pass-input').value;
      const user = USERS.find(u => u.email.toLowerCase() === email);

      if (!user || user.password !== pass) {
        const err = document.getElementById('login-error-msg');
        err.textContent = 'E-mail ou senha incorretos.';
        err.style.display = 'block';
        return;
      }

      state.me = user.name;
      await storageSet('my_name', user.name, false);
      if (!state.employees.some(e => e.name === user.name)) {
        state.employees.push({ id: uid(), name: user.name, points: 0 });
        await storageSet('employees', state.employees, true);
      }
      const emp = state.employees.find(e => e.name === user.name);
      state.currentModal = null;
      state.welcomeOverlay = { name: user.name, points: emp ? emp.points : 0 };
      renderApp();
    };

    document.getElementById('btn-submit-login').onclick = doLogin;
    document.getElementById('login-pass-input').onkeydown = (e) => { if (e.key === 'Enter') doLogin(); };
  } else if (state.currentModal === 'acionar') {
    const eligible = state.employees.filter(e => e.name !== state.me);
    modalSlot.innerHTML = `
      <div class="modal-backdrop">
        <div class="modal-panel tilt-3d-card">
          <h2 class="pop-layer-2">Acionar Reunião</h2>
          <p class="sub pop-layer-1">Selecione quem cometeu o erro e relate os fatos.</p>
          <div class="input-field pop-layer-1" style="margin-bottom:14px;">
            <label>Quem cometeu a falha?</label>
            <select id="ac-accused-select">
              <option value="">Selecione um colaborador...</option>
              ${eligible.map(e => `<option value="${escapeHtml(e.name)}">${escapeHtml(e.name)}</option>`).join('')}
            </select>
          </div>
          <div class="input-field pop-layer-1" style="margin-bottom:14px;">
            <label>Motivo do acionamento</label>
            <textarea id="ac-reason-text" rows="4" placeholder="Descreva os fatos com clareza..." style="resize:none;"></textarea>
          </div>
          <div class="modal-actions pop-layer-1">
            <button class="btn-modal-cancel" id="btn-cancel-ac">Cancelar</button>
            <button class="btn-action-primary" id="btn-confirm-ac">Abrir Sessão</button>
          </div>
        </div>
      </div>
    `;

    document.getElementById('btn-cancel-ac').onclick = () => { state.currentModal = null; renderApp(); };
    document.getElementById('btn-confirm-ac').onclick = async () => {
      const accused = document.getElementById('ac-accused-select').value;
      const reason = document.getElementById('ac-reason-text').value.trim();
      if (!accused || !reason) { showToast('⚠️ Preencha todos os campos.'); return; }

      const maxNo = state.records.filter(r => r.type === 'reuniao').reduce((max, r) => Math.max(max, r.numero || 0), 0);
      const newM = { id: uid(), type: 'reuniao', numero: maxNo + 1, requester: state.me, accused, reason, status: 'votacao', votes: {}, chat: [], createdAt: Date.now() };
      state.records.push(newM);
      await storageSet('records', state.records, true);
      state.currentModal = null;
      state.activeTab = 'reunioes';
      state.openMeetingId = newM.id;
      showToast('Sessão aberta!');
      renderApp();
    };
  }
}

/* =========================================================================
   7. INICIALIZAÇÃO
   ========================================================================= */

async function startSystem() {
  await loadData();
  new FullSpace3DUniverse();
  renderApp();

  setInterval(async () => {
    if (state.currentModal || state.activeTab === 'livro' || state.welcomeOverlay) return;
    const chatInput = document.getElementById('chat-text-input');
    if (chatInput && chatInput.value.trim().length > 0) return;
    try {
      await loadData();
      renderApp();
    } catch (e) {}
  }, 4000);
}

window.addEventListener('DOMContentLoaded', startSystem);
